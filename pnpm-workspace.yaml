# Build scripts are opt-in. Both keys are declared on purpose: pnpm 11+ reads
# `allowBuilds`, pnpm 10 reads `onlyBuiltDependencies`. Keeping them in sync
# means the repo installs cleanly whichever major runs it — a placeholder left
# in `allowBuilds` made pnpm 11 exit 1 on every `pnpm install` (and therefore
# on every `pnpm <script>`) while CI on pnpm 10 stayed green.
allowBuilds:
  esbuild: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

# Version pins. This lives here, not in the `pnpm` field of package.json:
# pnpm 11+ no longer reads that field and warns that the keys were ignored —
# a pin left there is silently inert. See KNOWN_ISSUES.md § "pnpm.overrides"
# for the unblock condition of each entry.
overrides:
  unstorage: 2.0.0-alpha.7
