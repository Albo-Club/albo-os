name: Update dependencies

on:
  schedule:
    # Mondays at 06:30 UTC (right after sync-skills at 06:00).
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  # actions: read — needed to look up which step failed (see the alert step).
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` — action-setup reads `packageManager` from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: update
        run: node scripts/update-deps.mjs
      # Validate BEFORE opening the PR — PRs created with GITHUB_TOKEN don't
      # trigger the CI workflow, so the same checks run here instead. A red
      # run on this workflow = an updated dependency breaks something.
      - if: steps.update.outputs.updated == 'true'
        run: pnpm lint
      - if: steps.update.outputs.updated == 'true'
        run: pnpm test:unit
      - if: steps.update.outputs.updated == 'true'
        run: pnpm build
      - name: Open PR
        if: steps.update.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-deps
          base: main
          commit-message: 'chore: weekly dependency updates (${{ steps.update.outputs.count }} direct)'
          title: 'chore: weekly dependency updates (${{ steps.update.outputs.count }} direct)'
          body: |
            Automated `pnpm update` run (`.github/workflows/update-deps.yml`):
            all dependencies bumped within their declared semver ranges — never
            a major jump. The updated packages are listed in the
            `CHANGELOG_PRODUIT.md` entry included in this PR.

            `pnpm lint`, `pnpm test:unit` and `pnpm build` all passed in the
            workflow run before this PR was opened (the CI workflow does not
            trigger on PRs created with `GITHUB_TOKEN`).
          labels: dependencies
          delete-branch: true

      # A weekly job that fails in silence is worse than no job: it looks like
      # dependencies are being kept up to date while nothing lands. This ran
      # red every Monday for over a month (a better-auth bump breaking `pnpm
      # lint`) and nobody saw it. Same open-or-comment shape as prod-smoke.yml.
      - name: Open or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`

            // Name the step that actually failed instead of presuming a cause.
            // This job fails on a dependency incompatibility (lint, build) as
            // readily as on plumbing (a repo setting refusing the PR), and an
            // alert that guesses sends the reader looking in the wrong place.
            let failedStep = null
            try {
              const { data } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              })
              for (const job of data.jobs) {
                const step = (job.steps || []).find((s) => s.conclusion === 'failure')
                if (step) {
                  failedStep = step.name
                  break
                }
              }
            } catch {
              // Raising the alert matters more than the detail — carry on without it.
            }

            const body = [
              'La mise à jour hebdomadaire des dépendances a échoué :',
              "aucune PR n'a été ouverte, donc **aucune mise à jour de dépendance",
              "n'est passée**.",
              '',
              `Run : ${runUrl}`,
              failedStep ? `Étape en échec : \`${failedStep}\`` : null,
              '',
              "Ouvrir le run, lire l'étape en échec, puis corriger. Les deux causes",
              'déjà rencontrées, à titre indicatif — ce ne sont pas les seules :',
              '',
              '- une dépendance ne compile plus dans sa plage semver → corriger le',
              "  code, ou épingler le paquet fautif dans `pnpm.overrides` (cf.",
              '  `KNOWN_ISSUES.md`) ;',
              "- l'ouverture de la PR est refusée → réglage du dépôt ou de",
              "  l'organisation, rien à voir avec les dépendances.",
              '',
              'Les échecs suivants sont commentés ici — refermer ce ticket une fois',
              'le workflow revenu au vert.',
            ]
              .filter((line) => line !== null)
              .join('\n')

            const { data: labelled } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies',
            })
            // listForRepo returns pull requests too, and the `chore/update-deps`
            // PR carries this very label — commenting the failure onto it would
            // bury the alert in the PR it is meant to replace.
            const open = labelled.filter((i) => !i.pull_request)
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Nouvel échec.\n\n${body}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔴 Mise à jour des dépendances : le run hebdomadaire échoue',
                labels: ['dependencies'],
                body,
              })
            }
