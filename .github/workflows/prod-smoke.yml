name: Prod smoke

# Daily unauthenticated smoke test against the production deployment.
# Reuses scripts/e2e-smoke.mjs (--url). On failure the run goes red
# (GitHub notification) and a `prod-smoke` issue is opened with the
# failing checks — or commented on if one is already open.
#
# Requires the repository VARIABLE (not secret) PROD_URL:
#   Settings → Secrets and variables → Actions → Variables
#   → New repository variable: PROD_URL = https://os.alboteam.com

on:
  schedule:
    # 05:00 UTC = 07:00 Paris in summer (CEST). Cron is fixed UTC, so it
    # drifts to 06:00 Paris in winter — accepted, not worth two crons.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require PROD_URL repository variable
        if: ${{ vars.PROD_URL == '' }}
        run: |
          echo "::error::Repository variable PROD_URL is not set. Settings → Secrets and variables → Actions → Variables → new variable PROD_URL (e.g. https://os.alboteam.com)."
          exit 1

      - name: Run smoke tests against prod
        id: smoke
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: |
          set -o pipefail
          # Strip ANSI colors so the output is readable in the issue body.
          node scripts/e2e-smoke.mjs --url "$PROD_URL" 2>&1 \
            | tee /dev/stderr | sed -e 's/\x1b\[[0-9;]*m//g' > smoke-output.txt

      - name: Open or update failure issue
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/github-script@v7
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        with:
          script: |
            const fs = require('fs')
            let output = '(pas de sortie capturée)'
            try {
              output = fs.readFileSync('smoke-output.txt', 'utf8').trim()
            } catch {}
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `Le smoke test quotidien contre **${process.env.PROD_URL}** a échoué.`,
              '',
              `Run : ${runUrl}`,
              '',
              '<details><summary>Sortie du smoke test</summary>',
              '',
              '```',
              output,
              '```',
              '',
              '</details>',
            ].join('\n')

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'prod-smoke',
            })
            if (open.length > 0) {
              // An alert is already open: log the new failure there instead
              // of opening a duplicate.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Nouvel échec du smoke test.\n\n${body}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔴 Prod smoke : la prod ne répond plus correctement',
                labels: ['prod-smoke'],
                body,
              })
            }
